<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 820" font-family="Inter,Arial,sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2f7d4f"/></marker></defs><rect width="1300" height="820" fill="#ffffff"/>
<text x="650" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#1b3a2a">Krishi Mitra: architecture</text>
<text x="650" y="60" text-anchor="middle" font-size="13" fill="#5b6b62">Farmer data stays on the phone. The server is stateless. Every figure is checked against tool results.</text>
<rect x="30" y="90" width="370" height="170" rx="12" fill="#eaf5ee" stroke="#2f7d4f" stroke-width="1.5"/><text x="44" y="116" font-weight="700" font-size="15" fill="#1b3a2a">Farmer's phone (React PWA, offline-first)</text><text x="44" y="138" font-size="12.5" fill="#3c4a42">Voice talk, photo, text; Telugu / Hindi / English + 6 more</text><text x="44" y="157" font-size="12.5" fill="#3c4a42">Today brief, week plan, price alerts, crop coach</text><text x="44" y="176" font-size="12.5" fill="#3c4a42">Installable, saved brief and plan work offline</text><text x="44" y="195" font-size="12.5" fill="#3c4a42">First-run consent notice</text>
<rect x="30" y="280" width="370" height="250" rx="12" fill="#fff6e0" stroke="#c9962b" stroke-width="1.5"/><text x="44" y="306" font-weight="700" font-size="15" fill="#1b3a2a">Stored ONLY on the device (localStorage)</text><text x="44" y="328" font-size="12.5" fill="#3c4a42">Profile and sowing date</text><text x="44" y="347" font-size="12.5" fill="#3c4a42">Khata (money notebook)</text><text x="44" y="366" font-size="12.5" fill="#3c4a42">My field (digital twin): area, soil, irrigation log</text><text x="44" y="385" font-size="12.5" fill="#3c4a42">My results (outcome log: predicted vs actual)</text><text x="44" y="404" font-size="12.5" fill="#3c4a42">Expert case history and replies</text><text x="44" y="423" font-size="12.5" fill="#3c4a42">Buyer offers, warnings cache, claim draft</text><text x="44" y="442" font-size="12.5" fill="#3c4a42">Photos are analysed, not stored; sharing is opt-in</text>
<rect x="30" y="550" width="370" height="140" rx="12" fill="#eaf5ee" stroke="#2f7d4f" stroke-width="1.5"/><text x="44" y="576" font-weight="700" font-size="15" fill="#1b3a2a">Share only on consent</text><text x="44" y="598" font-size="12.5" fill="#3c4a42">Expert case: WhatsApp / email / phone link</text><text x="44" y="617" font-size="12.5" fill="#3c4a42">Web Share API for the photo</text><text x="44" y="636" font-size="12.5" fill="#3c4a42">Place and photo are separate ticks, each time</text>
<rect x="470" y="90" width="360" height="150" rx="12" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/><text x="484" y="116" font-weight="700" font-size="15" fill="#1b3a2a">FastAPI server (stateless, one Render service)</text><text x="484" y="138" font-size="12.5" fill="#3c4a42">Rate limits, input validation, upload checks</text><text x="484" y="157" font-size="12.5" fill="#3c4a42">Streams agent steps (NDJSON)</text><text x="484" y="176" font-size="12.5" fill="#3c4a42">Mock mode only when no key; labelled sample/live</text>
<rect x="470" y="260" width="360" height="190" rx="12" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/><text x="484" y="286" font-weight="700" font-size="15" fill="#1b3a2a">Agent: tool-calling loop (max 6 steps)</text><text x="484" y="308" font-size="12.5" fill="#3c4a42">28 tools: prices (India + 40 countries), weather,</text><text x="484" y="327" font-size="12.5" fill="#3c4a42">planting, crop guide, water, season, disease,</text><text x="484" y="346" font-size="12.5" fill="#3c4a42">storage, livestock heat, loan, break-even,</text><text x="484" y="365" font-size="12.5" fill="#3c4a42">price seasonality, schemes, expert help</text><text x="484" y="384" font-size="12.5" fill="#3c4a42">verify.py: figures must match tool results</text>
<rect x="470" y="470" width="360" height="220" rx="12" fill="#eef3fb" stroke="#3b6fb6" stroke-width="1.5"/><text x="484" y="496" font-weight="700" font-size="15" fill="#1b3a2a">Computed-in-code features (no model maths)</text><text x="484" y="518" font-size="12.5" fill="#3c4a42">Farm Doctor: leaf % from SAM pixels, photo gate</text><text x="484" y="537" font-size="12.5" fill="#3c4a42">Early warning: crop-specific thresholds</text><text x="484" y="556" font-size="12.5" fill="#3c4a42">Digital twin report with basis per line</text><text x="484" y="575" font-size="12.5" fill="#3c4a42">Outcome report: predicted vs actual</text><text x="484" y="594" font-size="12.5" fill="#3c4a42">Buyer net income + verified registry only</text><text x="484" y="613" font-size="12.5" fill="#3c4a42">Expert case builder, urgency by rules</text><text x="484" y="632" font-size="12.5" fill="#3c4a42">Crop-loss 72-hour kit, Khata report</text>
<rect x="900" y="90" width="370" height="330" rx="12" fill="#eaf5ee" stroke="#2f7d4f" stroke-width="1.5"/><text x="914" y="116" font-weight="700" font-size="15" fill="#1b3a2a">Meta models (Meta Model API / Baseten)</text><text x="914" y="138" font-size="12.5" fill="#3c4a42">Muse Spark Open: agent, tools, vision, audio</text><text x="914" y="157" font-size="12.5" fill="#3c4a42">Muse Voice Transcribe: speech to text</text><text x="914" y="176" font-size="12.5" fill="#3c4a42">SAM 3.1: leaf and lesion segmentation</text><text x="914" y="195" font-size="12.5" fill="#3c4a42">Muse Wonder: independent second-opinion audit</text><text x="914" y="214" font-size="12.5" fill="#3c4a42">Muse Image: shareable advice card</text><text x="914" y="233" font-size="12.5" fill="#3c4a42">Muse Glimmer (open weights): fallback if main</text><text x="914" y="252" font-size="12.5" fill="#3c4a42">model fails (timeout, 5xx, 429)</text><text x="914" y="271" font-size="12.5" fill="#3c4a42"></text><text x="914" y="290" font-size="12.5" fill="#3c4a42">Open weights: Spark Open + Glimmer</text>
<rect x="900" y="440" width="370" height="250" rx="12" fill="#fff6e0" stroke="#c9962b" stroke-width="1.5"/><text x="914" y="466" font-weight="700" font-size="15" fill="#1b3a2a">Public data (labelled live / cached / sample)</text><text x="914" y="488" font-size="12.5" fill="#3c4a42">Open-Meteo: forecast, archive, geocoding</text><text x="914" y="507" font-size="12.5" fill="#3c4a42">data.gov.in Agmarknet: India mandi prices</text><text x="914" y="526" font-size="12.5" fill="#3c4a42">WFP / HDX: prices for 40+ countries</text><text x="914" y="545" font-size="12.5" fill="#3c4a42">Saved snapshot, then clearly labelled sample</text><text x="914" y="564" font-size="12.5" fill="#3c4a42">buyers.json: verified buyers (empty by default)</text><text x="914" y="583" font-size="12.5" fill="#3c4a42">Expert contacts: EXPERT_CONTACTS env</text>
<line x1="400" y1="170" x2="470" y2="170" stroke="#2f7d4f" stroke-width="2" marker-end="url(#a)"/><text x="435" y="164" font-size="11" fill="#2f7d4f" text-anchor="middle">HTTPS JSON</text>
<line x1="400" y1="400" x2="470" y2="360" stroke="#2f7d4f" stroke-width="2" marker-end="url(#a)"/><text x="435" y="374" font-size="11" fill="#2f7d4f" text-anchor="middle">stateless calls</text>
<line x1="830" y1="330" x2="900" y2="260" stroke="#2f7d4f" stroke-width="2" marker-end="url(#a)"/><text x="865" y="289" font-size="11" fill="#2f7d4f" text-anchor="middle">tool/model calls</text>
<line x1="830" y1="170" x2="900" y2="170" stroke="#2f7d4f" stroke-width="2" marker-end="url(#a)"/>
<line x1="830" y1="560" x2="900" y2="560" stroke="#2f7d4f" stroke-width="2" marker-end="url(#a)"/><text x="865" y="554" font-size="11" fill="#2f7d4f" text-anchor="middle">fetch + label</text>
<line x1="400" y1="620" x2="470" y2="590" stroke="#2f7d4f" stroke-width="2" marker-end="url(#a)"/><text x="435" y="599" font-size="11" fill="#2f7d4f" text-anchor="middle">payload on consent</text>
<rect x="30" y="715" width="1240" height="85" rx="12" fill="#f6f8f7" stroke="#cfd8d2"/><text x="46" y="742" font-size="14" font-weight="700" fill="#1b3a2a">Trust and safety rules</text><text x="46" y="765" font-size="12.5" fill="#3c4a42">No model-computed numbers. No pesticide names or doses. Unsure or severe: escalate to a human expert. Indicative tables are labelled indicative.</text><text x="46" y="785" font-size="12.5" fill="#3c4a42">Evaluation: offline suite (EVAL_V2.md) + 28-question live run. Tests: docs/TEST_REPORT.md. API: docs/API.md.</text></svg>