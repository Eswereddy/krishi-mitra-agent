<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1f7a4d"/></marker>
    <style>
      .box{fill:#fff;stroke:#1f7a4d;stroke-width:2;rx:14}
      .hi{fill:#e8f5ee}
      .t{font-size:15px;font-weight:700;fill:#1d2a22}
      .s{font-size:12.5px;fill:#4b5a51}
      .ar{stroke:#1f7a4d;stroke-width:2.2;fill:none;marker-end:url(#a)}
      .lbl{font-size:12px;fill:#1f7a4d;font-weight:700}
    </style>
  </defs>
  <rect width="960" height="500" fill="#f4f1e8"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#1d2a22">Krishi Mitra: how one question becomes a verified answer</text>

  <rect class="box hi" x="30" y="70" width="190" height="110"/>
  <text class="t" x="125" y="100" text-anchor="middle">Farmer</text>
  <text class="s" x="125" y="124" text-anchor="middle">speaks (Telugu / Hindi / English)</text>
  <text class="s" x="125" y="143" text-anchor="middle">types, or sends a crop photo</text>
  <text class="s" x="125" y="162" text-anchor="middle">hears the answer</text>

  <rect class="box" x="290" y="70" width="190" height="110"/>
  <text class="t" x="385" y="100" text-anchor="middle">React PWA</text>
  <text class="s" x="385" y="124" text-anchor="middle">voice mode, photo preview</text>
  <text class="s" x="385" y="143" text-anchor="middle">live agent steps, result cards</text>
  <text class="s" x="385" y="162" text-anchor="middle">offline shell, large text</text>

  <rect class="box" x="550" y="70" width="190" height="110"/>
  <text class="t" x="645" y="100" text-anchor="middle">FastAPI backend</text>
  <text class="s" x="645" y="124" text-anchor="middle">/api/transcribe  /api/agent/stream</text>
  <text class="s" x="645" y="143" text-anchor="middle">/api/diagnose/stream  /api/tts</text>

  <rect class="box hi" x="770" y="70" width="165" height="110"/>
  <text class="t" x="852" y="100" text-anchor="middle">Muse Spark Open</text>
  <text class="s" x="852" y="124" text-anchor="middle">open weights on Baseten</text>
  <text class="s" x="852" y="143" text-anchor="middle">chat, tool calling,</text>
  <text class="s" x="852" y="162" text-anchor="middle">vision, audio</text>

  <path class="ar" d="M220 125H288"/><path class="ar" d="M480 125H548"/><path class="ar" d="M740 125H768"/>
  <text class="lbl" x="254" y="116" text-anchor="middle">voice/photo</text>

  <rect class="box" x="550" y="230" width="385" height="70"/>
  <text class="t" x="742" y="256" text-anchor="middle">Agent loop (agent.py)</text>
  <text class="s" x="742" y="276" text-anchor="middle">the model picks tools, up to 6 steps</text>
  <text class="s" x="742" y="293" text-anchor="middle">each call is streamed to the app live</text>
  <path class="ar" d="M645 182V228"/>

  <rect class="box" x="30" y="230" width="480" height="230"/>
  <text class="t" x="270" y="258" text-anchor="middle">7 tools (real data, never invented)</text>
  <text class="s" x="50" y="288">get_mandi_price / best_markets / get_price_trend : Agmarknet via data.gov.in</text>
  <text class="s" x="50" y="312">get_weather : Open-Meteo forecast</text>
  <text class="s" x="50" y="336">check_schemes : PM-KISAN, PMFBY, KCC (documents + where to verify)</text>
  <text class="s" x="50" y="360">calculate_revenue : exact arithmetic in code, not by the model</text>
  <text class="s" x="50" y="384">get_expert_help : Kisan Call Centre 1800-180-1551</text>
  <text class="s" x="50" y="416">If a live source fails, the tool says so; prices fall back to</text>
  <text class="s" x="50" y="434">clearly labelled SAMPLE data.</text>
  <path class="ar" d="M548 265H512"/>

  <rect class="box hi" x="550" y="340" width="385" height="130"/>
  <text class="t" x="742" y="368" text-anchor="middle">Verification layer (verify.py, plain code)</text>
  <text class="s" x="742" y="392" text-anchor="middle">every figure of 3+ digits in the answer must appear</text>
  <text class="s" x="742" y="411" text-anchor="middle">in a tool result. If not: rewrite (2 tries), then show</text>
  <text class="s" x="742" y="430" text-anchor="middle">a visible "could not verify" warning.</text>
  <text class="lbl" x="742" y="450" text-anchor="middle">verified answer returns to the app: text, cards, voice</text>
  <path class="ar" d="M742 302V338"/>
</svg>
